name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests SpeechRecognition pyaudio pyttsx3 comtypes pywin32

      - name: Build Guava.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Guava
          --hidden-import pyttsx3.drivers.sapi5
          --hidden-import comtypes
          --hidden-import win32com
          Hidebar.py

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Guava.exe -DestinationPath dist/Guava-windows.zip -Force

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $t = "${{ github.ref_name }}"
          } else {
            $t = "${{ github.event.inputs.tag }}"
          }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload ${{ steps.tag.outputs.tag }} dist/Guava-windows.zip dist/Guava.exe --clobber
